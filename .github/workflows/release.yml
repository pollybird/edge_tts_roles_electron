name: release

# 推送 v* 标签自动构建并发布；也可手动指定已存在的 tag 重跑（用于补传附件）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有标签名（如 v2.0.3），用于手动重跑发布'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Linux + Windows 在 Ubuntu runner 上构建（Windows 借助 wine，签名用 osslsigncode）
  build-linux-win:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and checkout requested tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Windows NSIS 打包在 Linux runner 上需要 wine（rcedit / NSIS 辅助工具为 Windows 可执行文件）；
      # osslsigncode 供 Authenticode 签名（USE_SYSTEM_SIGNCODE=true，见下方 Build 步骤与 electron-builder.yml）
      - name: Install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 osslsigncode

      - name: Build Linux + Windows
        run: npm run build:linux && npm run build:win
        env:
          # electron-builder 内置 osslsigncode 依赖 libssl1.1（ubuntu 24.04 已移除），改用系统 apt 版本签名
          USE_SYSTEM_SIGNCODE: 'true'

      # 校验 Windows 安装包已带自签名（签名配置被意外跳过时让发布失败，而非静默发出未签名产物）
      - name: Verify Windows code signatures
        run: |
          for f in dist/*-setup.exe; do
            osslsigncode verify -CAfile build/win-codesign.cer "$f" > /dev/null 2>&1 \
              || { echo "::error::$f signature verification failed"; exit 1; }
            echo "signature OK: $f"
          done

      # 先发布 Linux + Windows 附件（同时创建 GitHub Release），供后续 mac 作业拉取合并后同步到 GitCode
      - name: Publish Linux + Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/latest.yml
            dist/latest-linux.yml

  # macOS DMG 必须在 macOS runner 上构建（依赖 hdiutil/sips/PyObjC，Linux 无可用替代）
  build-mac:
    runs-on: macos-latest
    needs: build-linux-win
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # 配置 GitCode 仓库 Secrets.GITCODE_TOKEN 后会自动镜像（推送 tag + 上传附件）
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and checkout requested tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac

      # 从已发布的 GitHub Release 拉取 Linux + Windows 附件，与 mac 产物合并后统一同步到 GitCode
      - name: Download Linux + Windows assets from GitHub Release
        run: |
          mkdir -p dist
          assets=$(curl -sH "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            | python3 -c "import sys,json; [print(a['id'],a['name']) for a in json.load(sys.stdin)['assets']]")
          while read id name; do
            [ -z "$name" ] && continue
            curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${id}" \
              -o "dist/${name}"
            echo "fetched ${name}"
          done <<< "$assets"

      - name: Publish macOS artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/latest-mac.yml

      # ---- 可选：镜像到 GitCode（Secrets 中配置 GITCODE_TOKEN 即启用）----
      - name: Push tag to GitCode
        if: env.GITCODE_TOKEN != ''
        run: |
          git remote add gitcode "https://pollybird:${GITCODE_TOKEN}@gitcode.com/pollybird/edge_tts_roles_electron.git"
          git push gitcode "HEAD:refs/tags/${RELEASE_TAG}"

      - name: Upload all assets to GitCode Release
        if: env.GITCODE_TOKEN != ''
        run: node scripts/publish-gitcode.mjs
        env:
          GITCODE_TAG: ${{ env.RELEASE_TAG }}
          GITCODE_NOTES_FILE: .github/release-notes-cn.md

      # Gitee 单附件限 100MB 且无上传 CI 通道，发布后需手动在 Gitee 建源码 Release
      - name: Reminder for Gitee
        if: always()
        run: |
          echo "::warning::GitHub/GitCode 附件已发布。Gitee 需手动创建源码 Release 并在说明中引导至 GitHub/GitCode 下载。"
