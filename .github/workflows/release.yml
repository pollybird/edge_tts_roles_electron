name: release

# 推送 v* 标签自动构建并发布；也可手动指定已存在的 tag 重跑（用于补传附件）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有标签名（如 v2.0.3），用于手动重跑发布'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Linux 产物在 Ubuntu runner 上原生构建
  build-linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and checkout requested tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux

      # 发布 Linux 附件（同时创建 GitHub Release），供后续 mac 作业拉取合并后同步到 GitCode
      - name: Publish Linux artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

  # Windows 产物在 Windows runner 上原生构建（signtool.exe 自签名，无需 wine/osslsigncode）
  build-windows:
    runs-on: windows-latest
    needs: build-linux
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and checkout requested tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      # 校验 Windows 安装包已带自签名（签名配置被意外跳过时让发布失败，而非静默发出未签名产物）
      - name: Verify Windows code signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\*-setup.exe
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            # 自签名证书不在系统信任链中，Status 可能为 UnknownError/NotTrusted，
            # 但只要签名嵌入（SignerCertificate 非空）且非 NotSigned/HashMismatch 即视为有效
            if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch' -or $null -eq $sig.SignerCertificate) {
              Write-Error "签名校验失败：$($f.Name) status=$($sig.Status)"
              exit 1
            }
            Write-Output "signature OK ($($sig.Status)): $($f.Name)"
          }

      - name: Publish Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  # macOS DMG 必须在 macOS runner 上构建（依赖 hdiutil/sips/PyObjC，Linux 无可用替代）
  build-mac:
    runs-on: macos-latest
    needs: [build-linux, build-windows]
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # 配置 GitCode 仓库 Secrets.GITCODE_TOKEN 后会自动镜像（推送 tag + 上传附件）
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and checkout requested tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac

      # 从已发布的 GitHub Release 拉取 Linux + Windows 附件，与 mac 产物合并后统一同步到 GitCode
      - name: Download Linux + Windows assets from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist --skip-existing
          ls -la dist/

      - name: Publish macOS artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/latest-mac.yml

      # ---- 可选：镜像到 GitCode（Secrets 中配置 GITCODE_TOKEN 即启用）----
      - name: Push tag to GitCode
        if: env.GITCODE_TOKEN != ''
        run: |
          git remote add gitcode "https://pollybird:${GITCODE_TOKEN}@gitcode.com/pollybird/edge_tts_roles_electron.git"
          git push gitcode "HEAD:refs/tags/${RELEASE_TAG}"

      - name: Upload all assets to GitCode Release
        if: env.GITCODE_TOKEN != ''
        run: node scripts/publish-gitcode.mjs
        env:
          GITCODE_TAG: ${{ env.RELEASE_TAG }}
          GITCODE_NOTES_FILE: .github/release-notes-cn.md

      # Gitee 单附件限 100MB 且无上传 CI 通道，发布后需手动在 Gitee 建源码 Release
      - name: Reminder for Gitee
        if: always()
        run: |
          echo "::warning::GitHub/GitCode 附件已发布。Gitee 需手动创建源码 Release 并在说明中引导至 GitHub/GitCode 下载。"
